[workspace]
resolver = "2"
members = ["api", "config", "etl", "postgres", "replicator", "telemetry"]

[workspace.dependencies]
actix-web = { version = "4.11", default-features = false }
actix-web-httpauth = { version = "0.8.2", default-features = false }
anyhow = { version = "1.0", default-features = false }
api = { path = "api" }
async-trait = { version = "0.1" }
aws-lc-rs = { version = "1.13", default-features = false }
base64 = { version = "0.22", default-features = false }
bigdecimal = { version = "0.4", default-features = false }
byteorder = { version = "1.5", default-features = false }
bytes = { version = "1.10" }
chrono = { version = "0.4", default-features = false }
clap = { version = "4.5", default-features = false }
config = { path = "config" }
constant_time_eq = { version = "0.4.2" }
duckdb = { version = "1.3", default-features = false, features = ["bundled"] }
etl = { path = "etl" }
futures = { version = "0.3", default-features = false }
gcp-bigquery-client = { version = "0.25", default-features = false }
insta = { version = "1.43", default-features = false }
k8s-openapi = { version = "0.25.0", default-features = false }
kube = { version = "1.1.0", default-features = false }
pg_escape = { version = "0.1", default-features = false }
pin-project-lite = { version = "0.2", default-features = false }
postgres = { path = "postgres" }
postgres-protocol = { git = "https://github.com/imor/rust-postgres", rev = "20265ef38e32a06f76b6f9b678e2077fc2211f6b" }
postgres-replication = { git = "https://github.com/imor/rust-postgres", default-features = false, rev = "20265ef38e32a06f76b6f9b678e2077fc2211f6b" }
prost = { version = "0.13", default-features = false }
rand = { version = "0.9.1", default-features = false }
replicator = { path = "replicator" }
reqwest = { version = "0.12", default-features = false }
rust-cli-config = { package = "config", version = "0.15.11", default-features = false }
rustls = { version = "0.23", default-features = false }
rustls-pemfile = { version = "2.2", default-features = false }
secrecy = { version = "0.8", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
sqlx = { version = "0.8", default-features = false }
telemetry = { path = "telemetry" }
thiserror = "2.0.12"
tokio = { version = "1.46", default-features = false }
tokio-postgres = { git = "https://github.com/imor/rust-postgres", default-features = false, rev = "20265ef38e32a06f76b6f9b678e2077fc2211f6b" }
tokio-postgres-rustls = { git = "https://github.com/imor/tokio-postgres-rustls", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-actix-web = { version = "0.7", default-features = false }
tracing-appender = { version = "0.2.3", default-features = false }
tracing-log = { version = "0.2.0", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
utoipa = { version = "4.2.3", default-features = false }
utoipa-swagger-ui = { version = "7.1.0", default-features = false }
uuid = { version = "1.17.0", default-features = false }

